<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <!--
      파비콘을 인라인 SVG 데이터 URI로 박는다.
      선언이 없으면 브라우저가 /favicon.ico를 알아서 요청하고, 없으니 404가 난다.
      실측 워터폴에서 그 404 한 번에 300ms를 버리고 있었다. 요청을 아예 없애는 게
      목적이라 별도 파일로 두지 않는다.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E"
    />
    <title>부동산 모니터</title>
    <!--
      첫 페인트 전에 저장된 테마를 적용해 잘못된 색이 번쩍이는 걸 막는다.
      React가 마운트되기 전에 실행되어야 하므로 인라인으로 둔다.
    -->
    <script>
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch {
        /* 저장소를 못 읽는 환경 — 기기 설정을 그대로 따른다 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
