name: Deploy Pages

# data/latest.json이 푸시되면(= 로컬에서 pnpm start를 돌리면) 페이지를 다시 만든다.
# 렌더 코드만 고쳐도 재배포되도록 src/render도 함께 감시한다.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/render/**"
      - "src/types/page.ts"
      - "src/utils/format.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 중간에 밀린 실행은 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 버전은 package.json의 packageManager를 따른다.
      # version 입력을 함께 주면 ERR_PNPM_BAD_PM_VERSION으로 실패한다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # 렌더는 data/latest.json만 읽으므로 시크릿이 필요 없다.
      - run: pnpm render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
